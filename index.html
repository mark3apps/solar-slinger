<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Solar Slinger</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="topleft">
    <div class="statbar" id="hullBar">
      <span class="statlabel">HULL</span>
      <span class="stattrack"><span id="hullFill"></span></span>
      <span class="statnum" id="hullNum">67/67</span>
    </div>
    <div class="statbar" id="shieldBar">
      <span class="statlabel">&#x26E8; SHLD</span>
      <span class="stattrack"><span id="shieldFill"></span></span>
      <span class="statnum" id="shieldNum">33/33</span>
    </div>
    <div id="progRow">
      <span id="tierLabel">TIER 0 &middot; SCOUT</span>
      <span id="livesText">&#x2665;&#x2665;&#x2665;</span>
    </div>
    <div id="xpBar"><span id="xpFill"></span></div>
    <div id="upList2"></div>
  </div>
  <div id="msg" class="hidden"></div>
</div>

<div id="deathScreen" class="panel hidden">
  <h1>SHIP DESTROYED</h1>
  <p id="deathCause"></p>
  <p class="small" id="deathLives">Press R to respawn</p>
</div>

<div id="gameoverScreen" class="panel hidden">
  <h1>GAME OVER</h1>
  <p id="gameoverCause"></p>
  <p class="small">All lives lost &mdash; press R to start a new run</p>
</div>

<div id="upgradeScreen" class="panel hidden">
  <h2 id="upTitle">CHOOSE AN UPGRADE</h2>
  <div id="upList"></div>
  <p class="small" id="upHint">Press 1 or 2 &mdash; or click a card</p>
</div>

<div id="pauseScreen" class="panel hidden">
  <h1>PAUSED</h1>
  <p class="small">Press P to resume</p>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
