name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Solar Slinger build ${{ github.run_number }}
          body: |
            Automated build of `${{ github.sha }}`.

            **macOS:** the app is unsigned. If macOS reports it as damaged or from an
            unidentified developer, right-click the app and choose Open, or run:
            `xattr -dr com.apple.quarantine "/Applications/Solar Slinger.app"`

            **Windows:** SmartScreen may warn because the installer is unsigned —
            choose "More info" → "Run anyway".
          files: artifacts/*
