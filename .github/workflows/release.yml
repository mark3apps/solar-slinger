name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Patch version is stamped from the CI run number so every release is
      # unique and monotonic (v0.1.41, v0.1.42, ...). Bump major/minor by
      # editing package.json; its patch digit is ignored on CI.
      - name: Stamp release version
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          npm pkg set version="${base}.${{ github.run_number }}"

      - name: Build installers
        run: npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute release version
        id: ver
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "version=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Solar Slinger v${{ steps.ver.outputs.version }}
          body: |
            Automated build of `${{ github.sha }}`.

            **macOS:** the app is ad-hoc signed but not notarized, so Gatekeeper will
            block the first launch. Either clear quarantine before opening:
            `xattr -dr com.apple.quarantine "/Applications/Solar Slinger.app"`
            or, after the blocked launch attempt, allow it under
            System Settings → Privacy & Security → "Open Anyway".
            (Right-click → Open no longer bypasses Gatekeeper on modern macOS.)

            **Windows:** SmartScreen may warn because the installer is unsigned —
            choose "More info" → "Run anyway".

            **Raspberry Pi / Linux arm64:** requires a 64-bit OS (Raspberry Pi OS
            64-bit on a Pi 3 or later). Install with:
            `sudo apt install ./solar-slinger_*_arm64.deb`
          files: artifacts/*
