name: Build & Release

# Releases are a deliberate act, not a side effect of merging: nothing runs on
# push. Trigger this from the Actions tab (or `gh workflow run release.yml`)
# when main is in a good place, and pick the semver bump.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: Build and generate notes, but publish nothing
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Version + notes are computed once, up front, so all three build runners and
  # the publish step agree on the same number.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.notes.outputs.version }}
      since: ${{ steps.notes.outputs.since }}
    steps:
      # The version comes from the newest v* tag, so the tags must actually be
      # fetched — a shallow checkout has none and every release would be 0.0.1.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate release notes
        id: notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          json=$(node scripts/changelog.mjs --bump "${{ inputs.bump }}" --json --notes-out release-notes.md)
          echo "$json"
          echo "version=$(jq -r .version <<<"$json")" >> "$GITHUB_OUTPUT"
          echo "since=$(jq -r '.since // ""' <<<"$json")" >> "$GITHUB_OUTPUT"

      - name: Preview notes in the job summary
        run: cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron-builder shells out to rpmbuild for the rpm target; the
      # GitHub ubuntu image doesn't guarantee it, so install explicitly.
      - name: Install rpm tooling (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # Stamped locally for this build only — the committed bump happens in
      # `publish`, after every runner has proved the build is green.
      - name: Stamp release version
        shell: bash
        run: npm pkg set version="${{ needs.prepare.outputs.version }}"

      - name: Build installers
        run: npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  # Everything with a side effect lives here, gated on a green build, so a
  # broken build can never leave a version commit or a dangling tag on main.
  publish:
    needs: [prepare, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Record the release in the repo
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm pkg set version="${{ needs.prepare.outputs.version }}"
          # --since is pinned to what `prepare` resolved so the committed entry
          # can't drift from the notes already attached to the release.
          node scripts/changelog.mjs \
            --bump "${{ inputs.bump }}" \
            --since "${{ needs.prepare.outputs.since }}" \
            --write-changelog --json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit -m "Release v${{ needs.prepare.outputs.version }}"
          # Annotated on purpose: --follow-tags refuses to push lightweight tags,
          # so a plain `git tag` here would leave the release tag local-only.
          # The tag points at the bump commit; the installers were built one
          # commit earlier and differ only by the version the build stamps in.
          git tag -a "v${{ needs.prepare.outputs.version }}" \
            -m "Solar Slinger v${{ needs.prepare.outputs.version }}"
          git push origin main --follow-tags

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Solar Slinger v${{ needs.prepare.outputs.version }}
          body_path: artifacts/release-notes.md
          files: artifacts/*.dmg,artifacts/*.exe,artifacts/*.deb,artifacts/*.rpm
